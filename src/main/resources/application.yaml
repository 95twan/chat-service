spring:
  application:
    name: chat-service
  datasource:
    source:
      jdbc-url: ${DB_SOURCE_URL}
      username: ${MYSQL_USER}
      password: ${MYSQL_PASSWORD}
      driver-class-name: com.mysql.cj.jdbc.Driver
      pool-name: SourceConnectionPool
      minimum-idle: 10
      maximum-pool-size: 20
      idle-timeout: 60000
      connection-timeout: 30000
    replica:
      jdbc-url: ${DB_REPLICA_URL}
      username: ${MYSQL_USER}
      password: ${MYSQL_PASSWORD}
      driver-class-name: com.mysql.cj.jdbc.Driver
      pool-name: ReplicaConnectionPool
      minimum-idle: 10
      maximum-pool-size: 20
      idle-timeout: 60000
      connection-timeout: 30000
  jpa:
    show-sql: true
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
  data:
    redis:
      host: ${REDIS_URL}
      port: 6379
      repositories:
        enabled: false

logging:
  level:
    com.zaxxer.hikari: DEBUG
    org.springframework.security: DEBUG
    org.springframework.security.web.FilterChainProxy: TRACE
