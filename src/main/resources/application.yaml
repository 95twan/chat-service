server:
  port: 8090

spring:
  application:
    name: chat-service
  datasource:
    source:
      jdbc-url: ${DB_SOURCE_URL}
      username: ${MYSQL_USER}
      password: ${MYSQL_PASSWORD}
      driver-class-name: com.mysql.cj.jdbc.Driver
      pool-name: SourceConnectionPool
      minimum-idle: 10
      maximum-pool-size: 20
      idle-timeout: 60000
      connection-timeout: 30000
    replica:
      jdbc-url: ${DB_REPLICA_URL}
      username: ${MYSQL_USER}
      password: ${MYSQL_PASSWORD}
      driver-class-name: com.mysql.cj.jdbc.Driver
      pool-name: ReplicaConnectionPool
      minimum-idle: 10
      maximum-pool-size: 20
      idle-timeout: 60000
      connection-timeout: 30000
  jpa:
    show-sql: true
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
  data:
    redis:
      host: ${REDIS_URL}
      port: 6379
      repositories:
        enabled: false
  kafka:
    bootstrap-servers: ${KAFKA1_URL}, ${KAFKA2_URL}, ${KAFKA3_URL}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        delivery.timeout.ms: 10000
        request.timeout.ms: 3000
        retry.backoff.ms: 100

message-system:
  kafka:
    listeners:
      push:
        topic: push-notification

